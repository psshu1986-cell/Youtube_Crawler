<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube 中国神仙视频排行榜</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: #0f0f11; color: #e4e4e7; min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

  /* 头部 */
  .header { text-align: center; margin-bottom: 32px; }
  .header h1 { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #f59e0b, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .header p { color: #71717a; margin-top: 6px; font-size: 14px; }

  /* 搜索区 */
  .search-box {
    background: #18181b; border: 1px solid #27272a; border-radius: 12px;
    padding: 20px; margin-bottom: 24px;
  }
  .search-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .search-row input {
    flex: 1; min-width: 200px;
    background: #27272a; border: 1px solid #3f3f46; border-radius: 8px;
    padding: 10px 14px; color: #e4e4e7; font-size: 14px;
    outline: none; transition: border-color .2s;
  }
  .search-row input:focus { border-color: #f59e0b; }
  .search-row input::placeholder { color: #52525b; }
  .search-row button {
    background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff;
    border: none; border-radius: 8px; padding: 10px 24px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: opacity .2s; white-space: nowrap;
  }
  .search-row button:hover { opacity: .85; }
  .search-row button:disabled { opacity: .5; cursor: not-allowed; }

  /* 选项行 */
  .options { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .options label { font-size: 13px; color: #a1a1aa; display: flex; align-items: center; gap: 6px; }
  .options select {
    background: #27272a; border: 1px solid #3f3f46; border-radius: 6px;
    padding: 4px 8px; color: #e4e4e7; font-size: 13px;
  }
  .tag-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .tag {
    background: #27272a; border: 1px solid #3f3f46; border-radius: 999px;
    padding: 4px 12px; font-size: 12px; color: #a1a1aa; cursor: pointer;
    transition: all .2s; user-select: none;
  }
  .tag:hover { border-color: #f59e0b; color: #e4e4e7; }
  .tag.active { background: #f59e0b20; border-color: #f59e0b; color: #fbbf24; }

  /* 加载 */
  .loading { text-align: center; padding: 60px 0; display: none; }
  .loading.show { display: block; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid #27272a;
    border-top-color: #f59e0b; border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: #71717a; font-size: 14px; }

  /* 错误 */
  .error { background: #7f1d1d; color: #fca5a5; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 14px; }
  .error.show { display: block; }

  /* 排行榜 */
  .ranking-section { display: none; }
  .ranking-section.show { display: block; }
  .ranking-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; margin-top: 32px;
  }
  .ranking-header:first-child { margin-top: 0; }
  .ranking-header h2 { font-size: 18px; font-weight: 600; }
  .ranking-header h2 .icon { margin-right: 8px; }
  .ranking-header .count { font-size: 13px; color: #71717a; }

  .table-wrap {
    background: #18181b; border: 1px solid #27272a; border-radius: 12px;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead { background: #1f1f23; }
  th {
    text-align: left; padding: 10px 12px; font-weight: 600;
    color: #a1a1aa; font-size: 12px; white-space: nowrap;
    border-bottom: 1px solid #27272a;
  }
  td { padding: 10px 12px; border-bottom: 1px solid #27272a; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1f1f23; }

  .rank { color: #71717a; font-size: 12px; width: 32px; text-align: center; }
  .rank-1 { color: #f59e0b; font-weight: 700; }
  .rank-2 { color: #a1a1aa; font-weight: 600; }
  .rank-3 { color: #d97706; font-weight: 600; }

  .title-cell { max-width: 400px; }
  .title-cell a {
    color: #e4e4e7; text-decoration: none; display: block;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .title-cell a:hover { color: #f59e0b; }

  .channel { color: #a1a1aa; font-size: 13px; white-space: nowrap; }
  .num { font-feature-settings: "tnum"; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .date { color: #71717a; font-size: 13px; white-space: nowrap; }

  .empty { text-align: center; padding: 40px; color: #71717a; font-size: 14px; }

  @media (max-width: 768px) {
    .container { padding: 16px 8px; }
    .search-box { padding: 12px; }
    table { font-size: 12px; }
    th, td { padding: 8px 6px; }
    .title-cell { max-width: 160px; }
    .header h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🏮 中国神仙视频排行榜</h1>
    <p>YouTube 搜索爬虫 · 探索中国神话、传说、神仙相关内容</p>
  </div>

  <div class="search-box">
    <div class="search-row">
      <input type="text" id="keywordInput" placeholder="输入搜索关键词，用逗号分隔…" value="{{ keywords|join('，') }}">
      <button id="searchBtn" onclick="doSearch()">🔍 搜索</button>
    </div>
    <div class="options">
      <label>时间范围 <select id="risingDays">
        <option value="7">近 7 天</option>
        <option value="30">近 30 天</option>
        <option value="60" selected>近 60 天</option>
        <option value="90">近 90 天</option>
        <option value="365">近一年</option>
      </select></label>
      <label>每关键词 <select id="maxPerKeyword">
        <option value="10">10 条</option>
        <option value="30" selected>30 条</option>
        <option value="50">50 条</option>
      </select></label>
    </div>
    <div class="tag-list" id="tagList">
      {% for kw in keywords %}
      <span class="tag active" onclick="toggleTag(this)">{{ kw }}</span>
      {% endfor %}
    </div>
  </div>

  <div class="error" id="errorBox"></div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>正在搜索 YouTube…</p>
  </div>

  <!-- 最多观看 -->
  <div class="ranking-section" id="viewedSection">
    <div class="ranking-header">
      <h2><span class="icon">🔥</span>最多观看 TOP</h2>
      <span class="count" id="viewedCount"></span>
    </div>
    <div class="table-wrap" id="viewedTable"></div>
  </div>

  <!-- 上升最快 -->
  <div class="ranking-section" id="risingSection">
    <div class="ranking-header">
      <h2><span class="icon">📈</span>上升最快 TOP</h2>
      <span class="count" id="risingCount"></span>
    </div>
    <div class="table-wrap" id="risingTable"></div>
  </div>
</div>

<script>
function toggleTag(el) {
  el.classList.toggle('active');
}

function getActiveKeywords() {
  const tags = document.querySelectorAll('#tagList .tag');
  const active = [];
  tags.forEach(t => { if (t.classList.contains('active')) active.push(t.textContent.trim()); });
  return active.length ? active : null;
}

function formatNum(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  return n.toLocaleString();
}

function buildTable(data) {
  if (!data || !data.length) return '<div class="empty">暂无数据</div>';
  const rows = data.map((v, i) => {
    let rankClass = 'rank';
    if (i === 0) rankClass += ' rank-1';
    else if (i === 1) rankClass += ' rank-2';
    else if (i === 2) rankClass += ' rank-3';

    return `<tr>
      <td class="${rankClass}">${i + 1}</td>
      <td class="title-cell"><a href="${v.url}" target="_blank" rel="noopener">${v.title}</a></td>
      <td class="channel">${v.channelTitle}</td>
      <td class="date">${v.publishedAt}</td>
      <td class="num">${formatNum(v.viewCount)}</td>
      <td class="num">${formatNum(v.likeCount)}</td>
      <td class="num">${formatNum(v.velocity)}</td>
    </tr>`;
  }).join('');

  return `<table>
    <thead><tr>
      <th style="width:32px">#</th>
      <th>标题</th>
      <th>频道</th>
      <th>发布时间</th>
      <th class="num">观看</th>
      <th class="num">点赞</th>
      <th class="num">日均观看</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

async function doSearch() {
  const kw = document.getElementById('keywordInput').value.trim();
  const keywords = getActiveKeywords() || (kw ? kw.split(/[，,]/).map(s => s.trim()).filter(Boolean) : null);
  if (!keywords || !keywords.length) {
    showError('请输入至少一个搜索关键词');
    return;
  }

  const risingDays = parseInt(document.getElementById('risingDays').value);
  const maxPerKeyword = parseInt(document.getElementById('maxPerKeyword').value);

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 搜索中…';

  hideError();
  document.getElementById('loading').classList.add('show');
  document.getElementById('viewedSection').classList.remove('show');
  document.getElementById('risingSection').classList.remove('show');

  try {
    const resp = await fetch(window.location.origin + '/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keywords, risingDays, maxPerKeyword }),
    });
    const result = await resp.json();

    if (result.error) {
      showError(result.error);
      return;
    }

    document.getElementById('viewedTable').innerHTML = buildTable(result.topViewed);
    document.getElementById('viewedCount').textContent = `共 ${result.totalViewed} 条`;

    document.getElementById('risingTable').innerHTML = buildTable(result.topRising);
    document.getElementById('risingCount').textContent = `共 ${result.totalRising} 条`;

    document.getElementById('viewedSection').classList.add('show');
    document.getElementById('risingSection').classList.add('show');
  } catch (e) {
    showError('请求失败: ' + e.message);
  } finally {
    document.getElementById('loading').classList.remove('show');
    btn.disabled = false;
    btn.textContent = '🔍 搜索';
  }
}

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = '❌ ' + msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('errorBox').classList.remove('show');
}

// Enter 键搜索
document.getElementById('keywordInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
