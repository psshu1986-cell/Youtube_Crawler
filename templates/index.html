<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube 视频排行榜</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: #0f0f11; color: #e4e4e7; min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

  .header { text-align: center; margin-bottom: 32px; }
  .header h1 { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #f59e0b, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .header p { color: #71717a; margin-top: 6px; font-size: 14px; }

  .search-box {
    background: #18181b; border: 1px solid #27272a; border-radius: 12px;
    padding: 20px; margin-bottom: 24px;
  }
  .search-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .search-row input {
    flex: 1; min-width: 200px;
    background: #27272a; border: 1px solid #3f3f46; border-radius: 8px;
    padding: 10px 14px; color: #e4e4e7; font-size: 14px;
    outline: none; transition: border-color .2s;
  }
  .search-row input:focus { border-color: #f59e0b; }
  .search-row input::placeholder { color: #52525b; }
  .search-row button {
    background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff;
    border: none; border-radius: 8px; padding: 10px 24px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .2s; white-space: nowrap;
  }
  .search-row button:hover { opacity: .85; }
  .search-row button:disabled { opacity: .5; cursor: not-allowed; }

  .api-key-row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  .api-key-label { font-size: 13px; color: #a1a1aa; white-space: nowrap; }
  .api-key-input {
    flex: 1; max-width: 400px;
    background: #27272a; border: 1px solid #3f3f46; border-radius: 8px;
    padding: 8px 12px; color: #e4e4e7; font-size: 13px; outline: none; transition: border-color .2s;
  }
  .api-key-input:focus { border-color: #f59e0b; }
  .api-key-input::placeholder { color: #52525b; }
  .api-key-hint { font-size: 12px; color: #71717a; cursor: pointer; white-space: nowrap; }
  .api-key-hint:hover { color: #fca5a5; }

  .options { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .options label { font-size: 13px; color: #a1a1aa; display: flex; align-items: center; gap: 6px; }
  .options select { background: #27272a; border: 1px solid #3f3f46; border-radius: 6px; padding: 4px 8px; color: #e4e4e7; font-size: 13px; }

  .loading { text-align: center; padding: 60px 0; display: none; }
  .loading.show { display: block; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid #27272a;
    border-top-color: #f59e0b; border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: #71717a; font-size: 14px; }

  .error { background: #7f1d1d; color: #fca5a5; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 14px; }
  .error.show { display: block; }

  /* Tab 导航 */
  .tab-bar { display: none; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab-bar.show { display: flex; }
  .tab-btn {
    padding: 8px 16px; border-radius: 8px 8px 0 0; font-size: 13px; cursor: pointer;
    background: #18181b; border: 1px solid #27272a; border-bottom: none;
    color: #71717a; transition: all .2s; user-select: none;
  }
  .tab-btn:hover { color: #e4e4e7; background: #1f1f23; }
  .tab-btn.active { background: #18181b; color: #fbbf24; border-color: #f59e0b; font-weight: 600; }
  .tab-btn .badge {
    display: inline-block; background: #27272a; border-radius: 999px;
    padding: 0 6px; font-size: 11px; margin-left: 4px; color: #71717a;
  }
  .tab-btn.active .badge { background: #f59e0b20; color: #fbbf24; }

  .ranking-section { display: none; }
  .ranking-section.show { display: block; }

  .ranking-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .ranking-header h2 { font-size: 18px; font-weight: 600; }
  .ranking-header h2 .icon { margin-right: 8px; }
  .ranking-header .count { font-size: 13px; color: #71717a; }
  .export-btn {
    background: none; border: 1px solid #3f3f46; border-radius: 6px;
    padding: 6px 14px; color: #a1a1aa; font-size: 12px; cursor: pointer;
    transition: all .2s; display: none;
  }
  .export-btn:hover { border-color: #22c55e; color: #4ade80; }
  .export-btn.show { display: inline-block; }

  .table-wrap { background: #18181b; border: 1px solid #27272a; border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead { background: #1f1f23; }
  th {
    text-align: left; padding: 10px 12px; font-weight: 600;
    color: #a1a1aa; font-size: 12px; white-space: nowrap;
    border-bottom: 1px solid #27272a;
  }
  td { padding: 10px 12px; border-bottom: 1px solid #27272a; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1f1f23; }

  .rank { color: #71717a; font-size: 12px; width: 32px; text-align: center; }
  .rank-1 { color: #f59e0b; font-weight: 700; }
  .rank-2 { color: #a1a1aa; font-weight: 600; }
  .rank-3 { color: #d97706; font-weight: 600; }

  .title-cell { max-width: 400px; }
  .title-cell a { color: #e4e4e7; text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title-cell a:hover { color: #f59e0b; }

  .channel { color: #a1a1aa; font-size: 13px; white-space: nowrap; }
  .num { font-feature-settings: "tnum"; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .date { color: #71717a; font-size: 13px; white-space: nowrap; }

  .empty { text-align: center; padding: 40px; color: #71717a; font-size: 14px; }

  .pagination {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; padding: 16px; flex-wrap: wrap;
  }
  .page-btn {
    background: #27272a; border: 1px solid #3f3f46; border-radius: 6px;
    padding: 6px 14px; color: #a1a1aa; font-size: 13px; cursor: pointer; transition: all .2s; user-select: none;
  }
  .page-btn:hover { border-color: #f59e0b; color: #e4e4e7; }
  .page-btn.active { background: #f59e0b20; border-color: #f59e0b; color: #fbbf24; font-weight: 600; }
  .page-btn:disabled { opacity: .3; cursor: not-allowed; }
  .page-btn:disabled:hover { border-color: #3f3f46; color: #a1a1aa; }
  .page-info { font-size: 13px; color: #71717a; white-space: nowrap; }
  .page-size-select { background: #27272a; border: 1px solid #3f3f46; border-radius: 6px; padding: 4px 8px; color: #e4e4e7; font-size: 13px; margin-left: 6px; }

  @media (max-width: 768px) {
    .container { padding: 16px 8px; }
    .search-box { padding: 12px; }
    table { font-size: 12px; }
    th, td { padding: 8px 6px; }
    .title-cell { max-width: 160px; }
    .header h1 { font-size: 22px; }
    .tab-btn { padding: 6px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🏮 YouTube 视频排行榜</h1>
    <p>搜索任意关键词 · 最多观看 / 最多点赞 / 最多评论 / 互动率最高 / 上升最快</p>
  </div>

  <div class="search-box">
    <div class="search-row">
      <input type="text" id="keywordInput" placeholder="输入搜索关键词，用空格或逗号分隔…" value="">
      <button id="searchBtn" onclick="doSearch()">🔍 搜索</button>
    </div>
    <div class="api-key-row">
      <label class="api-key-label">🔑 API Key</label>
      <input type="text" id="apiKeyInput" placeholder="输入 YouTube Data API Key" class="api-key-input">
      <span class="api-key-hint" onclick="document.getElementById('apiKeyInput').value=''">清除</span>
    </div>
    <div class="options">
      <label>时间范围 <select id="risingDays">
        <option value="7">近 7 天</option>
        <option value="30">近 30 天</option>
        <option value="60" selected>近 60 天</option>
        <option value="90">近 90 天</option>
        <option value="365">近一年</option>
      </select></label>
      <label>每关键词 <select id="maxPerKeyword">
        <option value="10">10 条</option>
        <option value="30" selected>30 条</option>
        <option value="50">50 条</option>
      </select></label>
    </div>
  </div>

  <div class="error" id="errorBox"></div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>正在搜索 YouTube…</p>
  </div>

  <!-- Tab 导航 -->
  <div class="tab-bar" id="tabBar">
    <div class="tab-btn active" data-tab="viewed" onclick="switchTab('viewed')">🔥 最多观看 <span class="badge" id="badgeViewed">0</span></div>
    <div class="tab-btn" data-tab="liked" onclick="switchTab('liked')">👍 最多点赞 <span class="badge" id="badgeLiked">0</span></div>
    <div class="tab-btn" data-tab="commented" onclick="switchTab('commented')">💬 最多评论 <span class="badge" id="badgeCommented">0</span></div>
    <div class="tab-btn" data-tab="engaged" onclick="switchTab('engaged')">⚡ 互动率最高 <span class="badge" id="badgeEngaged">0</span></div>
    <div class="tab-btn" data-tab="rising" onclick="switchTab('rising')">📈 上升最快 <span class="badge" id="badgeRising">0</span></div>
  </div>

  <!-- 排行榜容器 -->
  <div id="rankingArea"></div>
</div>

<script>
let PAGE_SIZE = 20;
const dataStore = {};
const tabKeys = ['viewed', 'liked', 'commented', 'engaged', 'rising'];
const tabLabels = { viewed: '最多观看', liked: '最多点赞', commented: '最多评论', engaged: '互动率最高', rising: '上升最快' };
const tabIcons = { viewed: '🔥', liked: '👍', commented: '💬', engaged: '⚡', rising: '📈' };
let currentTab = 'viewed';

function formatNum(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  return n.toLocaleString();
}

function formatEngagement(v) {
  const rate = (v.likeCount + v.commentCount) / Math.max(v.viewCount, 1);
  return (rate * 100).toFixed(2) + '%';
}

function getExtraColumns(tab) {
  if (tab === 'liked') return [{ label: '点赞', key: 'likeCount', fn: formatNum }];
  if (tab === 'commented') return [{ label: '评论', key: 'commentCount', fn: formatNum }];
  if (tab === 'engaged') return [{ label: '互动率', key: null, fn: formatEngagement }];
  if (tab === 'rising') return [{ label: '日均观看', key: 'velocity', fn: formatNum }];
  return [{ label: '点赞', key: 'likeCount', fn: formatNum }];
}

function renderSection(tab) {
  const data = dataStore[tab] || [];
  const total = data.length;
  const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
  const page = 1;
  const start = 0;
  const end = Math.min(PAGE_SIZE, total);
  const pageData = data.slice(0, end);
  const extraCols = getExtraColumns(tab);

  let html = '';
  if (!total) {
    html = '<div class="empty">暂无数据</div>';
  } else {
    const rows = pageData.map((v, i) => {
      const rank = i + 1;
      let rc = 'rank';
      if (rank === 1) rc += ' rank-1';
      else if (rank === 2) rc += ' rank-2';
      else if (rank === 3) rc += ' rank-3';

      let extras = '';
      if (tab === 'liked') extras = `<td class="num">${formatNum(v.likeCount)}</td>`;
      else if (tab === 'commented') extras = `<td class="num">${formatNum(v.commentCount)}</td>`;
      else if (tab === 'engaged') extras = `<td class="num">${formatEngagement(v)}</td>`;
      else if (tab === 'rising') extras = `<td class="num">${formatNum(v.velocity)}</td>`;
      else extras = `<td class="num">${formatNum(v.likeCount)}</td>`;

      return `<tr>
        <td class="${rc}">${rank}</td>
        <td class="title-cell"><a href="${v.url}" target="_blank" rel="noopener">${v.title}</a></td>
        <td class="channel">${v.channelTitle}</td>
        <td class="date">${v.publishedAt}</td>
        <td class="num">${formatNum(v.viewCount)}</td>
        ${extras}
      </tr>`;
    }).join('');

    let extraTh = '';
    if (tab === 'liked') extraTh = '<th class="num">点赞</th>';
    else if (tab === 'commented') extraTh = '<th class="num">评论</th>';
    else if (tab === 'engaged') extraTh = '<th class="num">互动率</th>';
    else if (tab === 'rising') extraTh = '<th class="num">日均观看</th>';
    else extraTh = '<th class="num">点赞</th>';

    html = `<table>
      <thead><tr>
        <th style="width:32px">#</th>
        <th>标题</th>
        <th>频道</th>
        <th>发布时间</th>
        <th class="num">观看</th>
        ${extraTh}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  // 分页
  let pageHtml = '';
  if (total > PAGE_SIZE) {
    let btns = '';
    btns += `<button class="page-btn" onclick="goPageTab('${tab}',${1})" disabled>‹ 上一页</button>`;
    btns += `<button class="page-btn active">1</button>`;
    if (totalPages > 1) btns += `<button class="page-btn" onclick="goPageTab('${tab}',${2})">2</button>`;
    if (totalPages > 2) btns += `<span class="page-info">…</span>`;
    if (totalPages > 1) btns += `<button class="page-btn" onclick="goPageTab('${tab}',${totalPages})">${totalPages}</button>`;
    btns += `<button class="page-btn" onclick="goPageTab('${tab}',${2})" ${totalPages <= 1 ? 'disabled' : ''}>下一页 ›</button>`;
    btns += `<span class="page-info">1-${end} / 共 ${total} 条</span>`;
    btns += `<select class="page-size-select" onchange="changePageSizeTab(this.value,'${tab}')">
      <option value="10">10条/页</option>
      <option value="20">20条/页</option>
      <option value="50">50条/页</option>
      <option value="100">100条/页</option>
    </select>`;
    pageHtml = `<div class="pagination">${btns}</div>`;
  }

  document.getElementById('rankingArea').innerHTML = `<div class="ranking-section show">
    <div class="ranking-header">
      <h2><span class="icon">${tabIcons[tab]}</span>${tabLabels[tab]} TOP</h2>
      <div>
        <span class="count">共 ${total} 条</span>
        <button class="export-btn show" onclick="exportCSV('${tab}')">📥 导出 CSV</button>
      </div>
    </div>
    <div class="table-wrap">${html}</div>
    ${pageHtml}
  </div>`;

  // 同步分页下拉
  const sel = document.querySelector('.page-size-select');
  if (sel) sel.value = String(PAGE_SIZE);
}

function exportCSV(tab) {
  const data = dataStore[tab] || [];
  if (!data.length) return;

  const headers = ['排名', '标题', '频道', '发布时间', '观看数', '点赞数', '评论数', '日均观看', '链接'];
  const rows = data.map((v, i) => [
    i + 1,
    `"${(v.title || '').replace(/"/g, '""')}"`,
    `"${(v.channelTitle || '').replace(/"/g, '""')}"`,
    v.publishedAt,
    v.viewCount,
    v.likeCount,
    v.commentCount,
    v.velocity,
    v.url,
  ]);

  const csv = '﻿' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const tabName = tabLabels[tab] || tab;
  a.download = `youtube_${tabName}_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// 分页切换
const tabPages = { viewed: 1, liked: 1, commented: 1, engaged: 1, rising: 1 };

function goPageTab(tab, page) {
  tabPages[tab] = page;
  const data = dataStore[tab] || [];
  const totalPages = Math.ceil(data.length / PAGE_SIZE) || 1;
  const p = Math.max(1, Math.min(page, totalPages));
  const start = (p - 1) * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, data.length);
  const pageData = data.slice(start, end);
  const extraCols = getExtraColumns(tab);

  if (!data.length) return;

  const rows = pageData.map((v, i) => {
    const rank = start + i + 1;
    let rc = 'rank';
    if (rank === 1) rc += ' rank-1';
    else if (rank === 2) rc += ' rank-2';
    else if (rank === 3) rc += ' rank-3';
    let extras = '';
    if (tab === 'liked') extras = `<td class="num">${formatNum(v.likeCount)}</td>`;
    else if (tab === 'commented') extras = `<td class="num">${formatNum(v.commentCount)}</td>`;
    else if (tab === 'engaged') extras = `<td class="num">${formatEngagement(v)}</td>`;
    else if (tab === 'rising') extras = `<td class="num">${formatNum(v.velocity)}</td>`;
    else extras = `<td class="num">${formatNum(v.likeCount)}</td>`;
    return `<tr>
      <td class="${rc}">${rank}</td>
      <td class="title-cell"><a href="${v.url}" target="_blank" rel="noopener">${v.title}</a></td>
      <td class="channel">${v.channelTitle}</td>
      <td class="date">${v.publishedAt}</td>
      <td class="num">${formatNum(v.viewCount)}</td>
      ${extras}
    </tr>`;
  }).join('');

  let extraTh = '';
  if (tab === 'liked') extraTh = '<th class="num">点赞</th>';
  else if (tab === 'commented') extraTh = '<th class="num">评论</th>';
  else if (tab === 'engaged') extraTh = '<th class="num">互动率</th>';
  else if (tab === 'rising') extraTh = '<th class="num">日均观看</th>';
  else extraTh = '<th class="num">点赞</th>';

  const tableHtml = `<table>
    <thead><tr>
      <th style="width:32px">#</th>
      <th>标题</th>
      <th>频道</th>
      <th>发布时间</th>
      <th class="num">观看</th>
      ${extraTh}
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  // 重建分页
  let btns = '';
  const total = data.length;
  const totalPg = Math.ceil(total / PAGE_SIZE) || 1;
  btns += `<button class="page-btn" onclick="goPageTab('${tab}',${p-1})" ${p <= 1 ? 'disabled' : ''}>‹ 上一页</button>`;
  const maxBtns = 5;
  let ps = Math.max(1, p - Math.floor(maxBtns / 2));
  let pe = Math.min(totalPg, ps + maxBtns - 1);
  if (pe - ps + 1 < maxBtns) ps = Math.max(1, pe - maxBtns + 1);
  if (ps > 1) btns += `<button class="page-btn" onclick="goPageTab('${tab}',1)">1</button>${ps > 2 ? '<span class="page-info">…</span>' : ''}`;
  for (let i = ps; i <= pe; i++) btns += `<button class="page-btn ${i === p ? 'active' : ''}" onclick="goPageTab('${tab}',${i})">${i}</button>`;
  if (pe < totalPg) btns += `${pe < totalPg - 1 ? '<span class="page-info">…</span>' : ''}<button class="page-btn" onclick="goPageTab('${tab}',${totalPg})">${totalPg}</button>`;
  btns += `<button class="page-btn" onclick="goPageTab('${tab}',${p+1})" ${p >= totalPg ? 'disabled' : ''}>下一页 ›</button>`;
  btns += `<span class="page-info">${start+1}-${end} / 共 ${total} 条</span>`;
  btns += `<select class="page-size-select" onchange="changePageSizeTab(this.value,'${tab}')">
    <option value="10">10条/页</option>
    <option value="20">20条/页</option>
    <option value="50">50条/页</option>
    <option value="100">100条/页</option>
  </select>`;

  const tableWrap = document.querySelector('.table-wrap');
  if (tableWrap) tableWrap.innerHTML = tableHtml;
  const pagination = document.querySelector('.ranking-section.show .pagination');
  if (pagination) {
    pagination.innerHTML = btns;
    const sel = pagination.querySelector('.page-size-select');
    if (sel) sel.value = String(PAGE_SIZE);
  }
}

function changePageSizeTab(size, tab) {
  PAGE_SIZE = parseInt(size);
  try { localStorage.setItem('yt_page_size', size); } catch(e) {}
  tabPages[tab] = 1;
  goPageTab(tab, 1);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
  tabPages[tab] = 1;
  renderSection(tab);
}

async function doSearch() {
  const apiKey = document.getElementById('apiKeyInput').value.trim();
  if (!apiKey) { showError('请输入 YouTube Data API Key'); return; }
  try { localStorage.setItem('yt_api_key', apiKey); } catch(e) {}

  const kw = document.getElementById('keywordInput').value.trim();
  const keywords = kw ? kw.split(/[，,、\s]+/).map(s => s.trim()).filter(Boolean) : null;
  if (!keywords || !keywords.length) { showError('请输入至少一个搜索关键词'); return; }

  const risingDays = parseInt(document.getElementById('risingDays').value);
  const maxPerKeyword = parseInt(document.getElementById('maxPerKeyword').value);

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 搜索中…';
  hideError();
  document.getElementById('loading').classList.add('show');
  document.getElementById('tabBar').classList.remove('show');

  try {
    const resp = await fetch(window.location.origin + '/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keywords, risingDays, maxPerKeyword, apiKey }),
    });
    const result = await resp.json();
    if (result.error) { showError(result.error); return; }

    try {
      const saved = localStorage.getItem('yt_page_size');
      if (saved) PAGE_SIZE = parseInt(saved);
    } catch(e) {}

    dataStore.viewed = result.topViewed || [];
    dataStore.liked = result.topLiked || [];
    dataStore.commented = result.topCommented || [];
    dataStore.engaged = result.topEngaged || [];
    dataStore.rising = result.topRising || [];

    tabKeys.forEach(k => { tabPages[k] = 1; });
    currentTab = 'viewed';

    document.getElementById('badgeViewed').textContent = result.totalViewed;
    document.getElementById('badgeLiked').textContent = (result.topLiked || []).length;
    document.getElementById('badgeCommented').textContent = (result.topCommented || []).length;
    document.getElementById('badgeEngaged').textContent = (result.topEngaged || []).length;
    document.getElementById('badgeRising').textContent = result.totalRising;

    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.tab-btn[data-tab="viewed"]').classList.add('active');
    document.getElementById('tabBar').classList.add('show');

    renderSection('viewed');
  } catch (e) {
    showError('请求失败: ' + e.message);
  } finally {
    document.getElementById('loading').classList.remove('show');
    btn.disabled = false;
    btn.textContent = '🔍 搜索';
  }
}

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = '❌ ' + msg;
  el.classList.add('show');
}
function hideError() { document.getElementById('errorBox').classList.remove('show'); }

document.getElementById('keywordInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});

document.addEventListener('DOMContentLoaded', function() {
  const base = window.location.origin;
  try {
    const saved = localStorage.getItem('yt_api_key');
    if (saved) document.getElementById('apiKeyInput').value = saved;
  } catch(e) {}
});
</script>
</body>
</html>
